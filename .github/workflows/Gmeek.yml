name: 旧站关服部署

# 2026-10-24：旧站已关服。原来那份 Gmeek 自动生成（读 GitHub Issues 重建站点）
# 已停用——它会覆盖手写的关服页，而且只在有人开 issue 或每天定时才跑。
# 现在只做一件事：把 docs/ 目录原样部署到 GitHub Pages。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署关服页
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: 上传 docs 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
